services:
  nginx:
    profiles: [prod]
    image: jonasal/nginx-certbot
    restart: always
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-ekeneazubuko2935@gmail.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_secrets:/etc/letsencrypt
      - ./user_conf.d:/etc/nginx/user_conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_DB: kontrol
      POSTGRES_USER: kontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-simulation-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontrol -d kontrol"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://kontrol:${POSTGRES_PASSWORD:-local-simulation-only}@db:5432/kontrol
      APP_ENV: ${APP_ENV:-development}
      DEMO_AUTH: ${DEMO_AUTH:-true}
      CREAO_MODE: ${CREAO_MODE:-mock}
      CREAO_BASE_URL: ${CREAO_BASE_URL:-}
      CREAO_API_KEY: ${CREAO_API_KEY:-}
      CREAO_API_VERSION: ${CREAO_API_VERSION:-v1}
      CREAO_INPUT_FIELD: ${CREAO_INPUT_FIELD:-context}
      CREAO_TIMEOUT: ${CREAO_TIMEOUT:-180}
      CREAO_POLL_SECONDS: ${CREAO_POLL_SECONDS:-2}
      CREAO_INVOKE_PATH: ${CREAO_INVOKE_PATH:-}
      CREAO_POLL_PATH: ${CREAO_POLL_PATH:-}
      CREAO_INTAKE_AGENT_ID: ${CREAO_INTAKE_AGENT_ID:-}
      CREAO_HOSPITAL_AGENT_ID: ${CREAO_HOSPITAL_AGENT_ID:-}
      CREAO_DISPATCH_AGENT_ID: ${CREAO_DISPATCH_AGENT_ID:-}
      CREAO_PLANNING_AGENT_ID: ${CREAO_PLANNING_AGENT_ID:-}
      LIVE_SIMULATION_ENABLED: ${LIVE_SIMULATION_ENABLED:-false}
      TRANSCRIPTION_MODE: ${TRANSCRIPTION_MODE:-mock}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      TRANSCRIPTION_BASE_URL: ${TRANSCRIPTION_BASE_URL:-https://api.openai.com/v1}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      TRANSCRIPTION_TIMEOUT: ${TRANSCRIPTION_TIMEOUT:-60}
      CALL_AUDIO_DIR: /app/call_audio
      CALL_MAX_AUDIO_BYTES: ${CALL_MAX_AUDIO_BYTES:-20971520}
      CALL_MAX_DURATION_SECONDS: ${CALL_MAX_DURATION_SECONDS:-300}
      CALL_GEOCODING_URL: ${CALL_GEOCODING_URL-https://photon.komoot.io/api/}
      CALL_INTERSECTIONS_URL: ${CALL_INTERSECTIONS_URL-https://data.sf.gov/resource/gmfx-8h6i.json}
      TELEPHONY_ENABLED: ${TELEPHONY_ENABLED:-false}
      TELEPHONY_PUBLIC_URL: ${TELEPHONY_PUBLIC_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TWILIO_RECORD_CALLS: ${TWILIO_RECORD_CALLS:-false}
      LIVE_TRANSCRIPTION_API_KEY: ${LIVE_TRANSCRIPTION_API_KEY:-}
      LIVE_TRANSCRIPTION_MODEL: ${LIVE_TRANSCRIPTION_MODEL:-gpt-live-transcribe}
      LIVE_TRANSCRIPTION_URL: ${LIVE_TRANSCRIPTION_URL:-wss://api.openai.com/v1/realtime?intent=transcription}
      LIVE_FINALIZATION_TIMEOUT: ${LIVE_FINALIZATION_TIMEOUT:-30}
      DEMO_FLEET_ENABLED: ${DEMO_FLEET_ENABLED:-false}
      MOCK_AGENT_SECONDS: ${MOCK_AGENT_SECONDS:-3}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-1}
    volumes:
      - call_audio:/app/call_audio
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  worker:
    build: ./backend
    environment: *backend-env
    volumes:
      - call_audio:/app/call_audio
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from app.db import SessionLocal,now; from app.models import Simulation; from sqlalchemy import select; s=SessionLocal().scalar(select(Simulation)); assert s and now().timestamp()-s.worker_heartbeat.timestamp()<150"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  phone-ingress:
    profiles: [phone]
    build: ./backend
    environment: *backend-env
    command: ["uvicorn", "app.telephony_ingress:app", "--host", "0.0.0.0", "--port", "8001", "--ws-max-size", "65536"]
    ports:
      - "127.0.0.1:${TELEPHONY_INGRESS_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  nginx_secrets:
  call_audio:
  postgres_data:
