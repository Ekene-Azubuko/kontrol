# SIMULATION (NOT FOR EMERGENCY USE).
# The image's built-in port 80 server handles ACME challenges and HTTPS redirects.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name creaokontrol.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/creaokontrol.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creaokontrol.duckdns.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/creaokontrol.duckdns.org/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Allow the application's 20 MiB audio limit plus multipart overhead.
    client_max_body_size 25m;

    location / {
        # Resolve again after container replacement instead of retaining a stale IP.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Deliver API event streams immediately and allow slow provider requests.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
